<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المحاكاة الفلكية 2026 - نظام الرؤية الشامل</title>
    <style>
        :root { --gold: #ffcc33; --glass: rgba(10, 10, 15, 0.98); --border: rgba(255, 204, 51, 0.4); --kuiper: #50fa7b; --shuttle: #00ffff; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: white; }
        #gui { 
            position: fixed; top: 0; right: 0; width: 350px; height: 100vh;
            background: var(--glass); backdrop-filter: blur(40px);
            border-left: 1px solid var(--border); z-index: 1000;
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }
        #gui.hidden { transform: translateX(100%); }
        #toggle-gui {
            position: fixed; top: 20px; right: 360px; background: var(--glass);
            color: var(--gold); border: 1px solid var(--border); padding: 12px;
            cursor: pointer; z-index: 1001; border-radius: 12px; font-weight: bold;
        }
        h2 { color: var(--gold); border-bottom: 2px solid var(--border); padding-bottom: 10px; font-size: 16px; text-align: center; margin: 0; }
        .control-group { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-top: 15px; border: 1px solid var(--border); }
        .section-label { font-size: 10px; color: var(--gold); margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 1.2px; font-weight: bold; }
        input[type=range] { width: 100%; accent-color: var(--gold); margin: 5px 0; }
        label { font-size: 11px; display: flex; justify-content: space-between; margin-top: 5px; color: #ddd; align-items: center; }
        #planetary-list { flex-grow: 1; overflow-y: auto; margin-top: 15px; }
        button { 
            background: rgba(255, 204, 51, 0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); 
            padding: 10px; width: 100%; margin-bottom: 6px; cursor: pointer; text-align: right;
            border-radius: 8px; transition: 0.3s; font-size: 12px;
        }
        button:hover { background: rgba(255, 204, 51, 0.2); border-color: var(--gold); }
        .active-target { border-color: var(--gold) !important; background: rgba(255, 204, 51, 0.3) !important; }
        .shuttle-btn { border-color: var(--shuttle) !important; color: var(--shuttle); font-weight: bold; background: rgba(0, 255, 255, 0.1) !important; }
        .toggle-btn { background: var(--gold); color: black; font-weight: bold; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="gui">
        <h2>الرصد الكوني - نظام الرؤية المحسن</h2>
        
        <div class="control-group">
            <span class="section-label">🌌 الاندفاع المجرى (Helical Motion)</span>
            <label>سرعة اندفاع الشمس: <input type="range" id="galacticSpeed" min="0" max="25" step="0.1" value="12"></label>
            <button id="trailBtn" class="toggle-btn" onclick="toggleTrails()">إخفاء ذيل الرصد</button>
        </div>

        <div class="control-group" style="border-color: var(--kuiper);">
            <span class="section-label" style="color:var(--kuiper)">💍 الأحزمة الغبارية (Asteroid & Kuiper)</span>
            <label>حجم الصخور الموحد: <input type="range" id="kRockSize" min="0.1" max="50.0" step="0.1" value="1.0"></label>
            <label>كثافة الأحزمة: <input type="range" id="kDensity" min="0.1" max="1.0" step="0.05" value="1.0"></label>
        </div>

        <div class="control-group">
            <span class="section-label">📐 فيزياء الدوامة</span>
            <label>حجم الأجرام (Scale): <input type="range" id="scaleRange" min="0.01" max="20.0" step="0.1" value="1.0"></label>
            <label>سرعة الدوران المداري: <input type="range" id="speedRange" min="0" max="10" step="0.1" value="4"></label>
        </div>

        <button onclick="focusTarget('الشمس', this)" class="active-target">☀️ قلب النظام (الشمس)</button>
        
        <button id="shuttleFocusBtn" class="shuttle-btn" onclick="focusShuttle(this)">🚀 رصد المكوك (Up Base)</button>
        
        <div id="planetary-list"></div>
    </div>

    <button id="toggle-gui" onclick="document.getElementById('gui').classList.toggle('hidden')">☰</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // === 1. الإعدادات الفنية الصارمة والملاحة ===
        const SUN_RADIUS = 5000000;
        const GALAXY_RADIUS = 100000000000;
        const ORION_ARM_DIST = GALAXY_RADIUS * 0.27;
        const MAX_POINTS = 2000; 
        let trailsVisible = true;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.0001, GALAXY_RADIUS * 3);
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = SUN_RADIUS * 0.5; 
        controls.maxDistance = GALAXY_RADIUS * 2;

        const galaxyPivot = new THREE.Group();
        const systemAnchor = new THREE.Group(); 
        const solarVortex = new THREE.Group(); 
        const kuiperBeltGroup = new THREE.Group(); 
        const asteroidBeltGroup = new THREE.Group();
        const allTrails = [];

        scene.add(galaxyPivot);
        galaxyPivot.add(systemAnchor);
        systemAnchor.add(solarVortex);
        systemAnchor.add(kuiperBeltGroup);
        solarVortex.add(asteroidBeltGroup);
        systemAnchor.position.x = ORION_ARM_DIST;

        function createRadialTrail(color) {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(MAX_POINTS * 3);
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.LineBasicMaterial({ 
                color: color, 
                transparent: true, 
                opacity: 0.8, 
                blending: THREE.AdditiveBlending,
                depthWrite: false 
            });
            const line = new THREE.Line(geo, mat);
            line.renderOrder = 1; 
            line.userData = { history: [] };
            scene.add(line);
            allTrails.push(line);
            return line;
        }

        function toggleTrails() {
            trailsVisible = !trailsVisible;
            allTrails.forEach(trail => trail.visible = trailsVisible);
            document.getElementById('trailBtn').innerText = trailsVisible ? "إخفاء ذيل الرصد" : "إظهار ذيل الرصد";
        }

        // === 2. النجوم المجرية (الحفاظ على العمق) ===
        const starGeo = new THREE.BufferGeometry();
        const starCount = 300000;
        const starPos = new Float32Array(starCount * 3);
        const starCol = new Float32Array(starCount * 3);
        for(let i=0; i<starCount; i++) {
            let r = Math.pow(Math.random(), 1.4) * GALAXY_RADIUS;
            let a = Math.random() * Math.PI * 2;
            starPos[i*3] = Math.cos(a)*r; 
            starPos[i*3+1] = (Math.random()-0.5)*GALAXY_RADIUS * 0.1; 
            starPos[i*3+2] = Math.sin(a)*r;
            let c = new THREE.Color().setHSL(0.6 + Math.random()*0.1, 0.8, 0.7);
            starCol[i*3] = c.r; starCol[i*3+1] = c.g; starCol[i*3+2] = c.b;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ 
            size: 1.0, vertexColors: true, transparent: true, opacity: 0.7, 
            blending: THREE.AdditiveBlending, depthWrite: false 
        }));
        stars.renderOrder = 0;
        scene.add(stars);

        // === 3. الشمس (تجميد الأسطح والضوء) ===
        const loader = new THREE.TextureLoader();
        const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(SUN_RADIUS, 128, 128), new THREE.MeshBasicMaterial({ 
            map: loader.load('https://threejs.org/examples/textures/lava/lavatile.jpg'), color: 0xffcc33 
        }));
        sunMesh.renderOrder = 2;
        solarVortex.add(sunMesh);
        sunMesh.add(new THREE.PointLight(0xffffff, 6, 0));
        const sunTrail = createRadialTrail(0xffcc33);

        // === 4. الكواكب والسينما (Logic Freeze) ===
        const planetsData = [
            { name: "عطارد", size: 80000, dist: 25000000, speed: 0.15, color: 0x8C7853 },
            { name: "الزهرة", size: 190000, dist: 45000000, speed: 0.12, color: 0xFFC649 },
            { name: "الأرض", size: 210000, dist: 70000000, speed: 0.1, color: 0x2233FF, moons: [{name: "القمر", size:55000, dist:3500000, speed:0.3}] },
            { name: "المريخ", size: 120000, dist: 100000000, speed: 0.08, color: 0xFF5522, moons: [{name: "فوبوس", size:30000, dist:2000000, speed:0.4}] },
            { name: "المشتري", size: 1400000, dist: 180000000, speed: 0.05, color: 0xFFA500 },
            { name: "زحل", size: 1200000, dist: 260000000, speed: 0.04, color: 0xEEDDA0, rings: true },
            { name: "أورانوس", size: 600000, dist: 350000000, speed: 0.03, color: 0x66FFFF },
            { name: "نبتون", size: 580000, dist: 440000000, speed: 0.02, color: 0x3355FF },
            { name: "بلوتو", size: 65000, dist: 520000000, speed: 0.015, color: 0xAAAAAA }
        ];

        const planets = [];
        let moonTargetMesh = null; // سيتم ربط المكوك به

        planetsData.forEach(d => {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(d.size, 64, 64), new THREE.MeshStandardMaterial({ color: d.color, metalness: 0.1, roughness: 0.8 }));
            mesh.userData = { angle: Math.random()*Math.PI*2, dist: d.dist, speed: d.speed };
            mesh.renderOrder = 2;
            scene.add(mesh); 
            const trail = createRadialTrail(d.color);
            const moons = [];
            if(d.moons) d.moons.forEach(m => {
                const mm = new THREE.Mesh(new THREE.SphereGeometry(m.size, 32, 32), new THREE.MeshStandardMaterial({ color: 0xaaaaaa }));
                mm.userData = { angle: Math.random()*6, dist: m.dist, speed: m.speed };
                mm.renderOrder = 2;
                scene.add(mm); moons.push(mm);
                if(m.name === "القمر") moonTargetMesh = mm; 
            });
            planets.push({ mesh, moons, d, trail });
            const btn = document.createElement('button');
            btn.innerText = d.name;
            btn.onclick = () => focusTarget(d.name, btn);
            document.getElementById('planetary-list').appendChild(btn);
        });

        // === 5. حقن المكوك الفضائي (The Shuttle Injection) ===
        let spaceShuttle;
        const fbxLoader = new THREE.FBXLoader();
        fbxLoader.load('up_base.fbx', (object) => {
            spaceShuttle = object;
            // ربط المكوك بالقمر مباشرة ليتحرك معه في الرقصة الكونية
            moonTargetMesh.add(spaceShuttle);
            // وضعه في مدار قريب جداً من القمر
            spaceShuttle.position.set(80000, 80000, 0); 
            // توجيه المكوك
            spaceShuttle.rotation.set(Math.PI/2, 0, 0);
        });

        // === 6. الأحزمة (كايبر وكويكبات) ===
        const allRocks = [];
        function createBelt(array, count, minDist, maxDist, group, baseSize, isKuiper) {
            for(let i=0; i<count; i++) {
                const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(baseSize, 0), new THREE.MeshStandardMaterial({ color: 0x888888 }));
                const angle = Math.random() * Math.PI * 2;
                const dist = minDist + Math.random() * (maxDist - minDist);
                rock.userData = { angle, dist, vShift: (Math.random()-0.5)*30000000, randID: Math.random(), baseSize, isKuiper };
                rock.renderOrder = 1;
                group.add(rock);
                array.push(rock);
            }
        }
        createBelt(allRocks, 5000, 115000000, 145000000, asteroidBeltGroup, 30000, false);
        createBelt(allRocks, 12000, 700000000, 1200000000, kuiperBeltGroup, 60000, true);

        let targetObj = sunMesh, clock = 0, gAngle = 0, vortexZ = 0;

        function updateTrail(trail, currentPos) {
            if (!trailsVisible) return;
            const history = trail.userData.history;
            const fixedMaxLen = 800; 
            history.push(currentPos.clone());
            if(history.length > fixedMaxLen) history.shift();
            const positions = trail.geometry.attributes.position.array;
            for(let i=0; i<history.length; i++) {
                positions[i*3] = history[i].x; positions[i*3+1] = history[i].y; positions[i*3+2] = history[i].z;
            }
            trail.geometry.setDrawRange(0, history.length);
            trail.geometry.attributes.position.needsUpdate = true;
        }

        window.focusTarget = (name, btn) => {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active-target'));
            if(btn) btn.classList.add('active-target');
            if(name === 'الشمس') targetObj = sunMesh;
            else planets.forEach(p => { if(p.d.name === name) targetObj = p.mesh; });
        };

        window.focusShuttle = (btn) => {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active-target'));
            btn.classList.add('active-target');
            if(spaceShuttle) targetObj = spaceShuttle;
        };

        // === 7. محرك اللولب والإخراج السينمائي (Strict Logic) ===
        function animate() {
            requestAnimationFrame(animate);
            const simSpeed = parseFloat(document.getElementById('speedRange').value);
            const gSpeed = parseFloat(document.getElementById('galacticSpeed').value);
            const scale = parseFloat(document.getElementById('scaleRange').value);
            const rockScale = parseFloat(document.getElementById('kRockSize').value);
            const density = parseFloat(document.getElementById('kDensity').value);
            
            clock += 0.01 * simSpeed;
            vortexZ += gSpeed * 100000 * simSpeed;
            solarVortex.position.z = vortexZ;

            gAngle += 0.00005 * simSpeed;
            galaxyPivot.rotation.y = gAngle;

            sunMesh.position.x = Math.sin(clock * 0.5) * 5000000;
            sunMesh.position.y = Math.cos(clock * 0.5) * 5000000;
            sunMesh.scale.setScalar(scale);

            const sunWorldPos = new THREE.Vector3();
            sunMesh.getWorldPosition(sunWorldPos);
            updateTrail(sunTrail, sunWorldPos);

            planets.forEach(p => {
                p.mesh.userData.angle += p.d.speed * simSpeed * 0.1;
                const orbitX = Math.sin(p.mesh.userData.angle) * p.d.dist;
                const orbitY = Math.cos(p.mesh.userData.angle) * p.d.dist;
                const helicalLag = - (p.d.dist * 0.15); 
                p.mesh.position.set(sunWorldPos.x + orbitX, sunWorldPos.y + orbitY, sunWorldPos.z + helicalLag);
                p.mesh.scale.setScalar(scale);
                updateTrail(p.trail, p.mesh.position);
                p.moons.forEach(m => {
                    m.userData.angle += m.userData.speed * simSpeed * 0.5;
                    m.position.set(p.mesh.position.x + Math.sin(m.userData.angle) * m.userData.dist, p.mesh.position.y + Math.cos(m.userData.angle) * m.userData.dist, p.mesh.position.z);
                    m.scale.setScalar(scale);
                });
            });

            // تحديث حجم المكوك ديناميكياً مع التحكم
            if (spaceShuttle) {
                spaceShuttle.scale.setScalar(scale * 250); // ضبط التناسب مع حجم القمر
                spaceShuttle.rotation.y += 0.01; // دوران هادئ للمكوك
            }

            kuiperBeltGroup.position.copy(solarVortex.position);
            allRocks.forEach(rock => {
                rock.visible = rock.userData.randID < density;
                if(rock.visible) {
                    rock.scale.setScalar(rockScale);
                    rock.userData.angle += (rock.userData.isKuiper ? 0.0002 : 0.001) * simSpeed;
                    let r = rock.userData.dist;
                    rock.position.set(Math.cos(rock.userData.angle)*r, rock.userData.vShift, Math.sin(rock.userData.angle)*r);
                }
            });

            if(targetObj) {
                const wp = new THREE.Vector3();
                targetObj.getWorldPosition(wp);
                controls.target.lerp(wp, 0.1);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
